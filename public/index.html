<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SF Creative Events ✿</title>
  <meta name="description" content="Curated creative events in San Francisco — workshops, exhibitions, craft fairs, and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ice-blue: #D6EAF0;
      --ice-blue-deep: #A8D4E0;
      --rose-pink: #F2D4D7;
      --rose-deep: #E8B4BA;
      --lavender: #E1D5ED;
      --lavender-deep: #C9B3DB;
      --cream: #FDF8F4;
      --warm-white: #FEFCFA;
      --text-primary: #3A3238;
      --text-secondary: #7A6B74;
      --text-light: #A89BA2;
      --border-soft: #EDE6E9;
      --card-shadow: 0 2px 16px rgba(58, 50, 56, 0.06);
      --card-hover-shadow: 0 8px 32px rgba(58, 50, 56, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Soft background orbs ── */
    body::before {
      content: '';
      position: fixed;
      top: -200px; right: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(214, 234, 240, 0.4) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(ellipse, rgba(242, 212, 215, 0.35) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .bg-orb {
      position: fixed;
      width: 500px; height: 500px;
      background: radial-gradient(ellipse, rgba(225, 213, 237, 0.3) 0%, transparent 70%);
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative; z-index: 1;
      text-align: center;
      padding: 56px 24px 16px;
    }

    .bow-decoration svg {
      width: 56px; height: 28px; opacity: 0.45;
      margin-bottom: 6px;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.2rem, 5.5vw, 3.4rem);
      color: var(--text-primary);
      letter-spacing: 0.02em;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    header h1 .flower { font-size: 0.65em; opacity: 0.55; }

    header .subtitle {
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--text-light);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .ribbon-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin: 0 auto 32px; max-width: 280px;
    }
    .ribbon-divider .line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
    }
    .ribbon-divider .bow-icon { font-size: 0.85rem; color: var(--text-light); opacity: 0.5; }

    /* ── Time filter ── */
    .time-filter {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 0 24px 12px; flex-wrap: wrap;
    }

    .time-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem; font-weight: 400;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 7px 18px;
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      background: var(--warm-white);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .time-btn:hover {
      border-color: var(--rose-deep); color: var(--text-primary);
    }
    .time-btn.active {
      background: var(--text-primary); color: var(--cream);
      border-color: var(--text-primary);
    }

    /* ── Source filter (subtle) ── */
    .source-filter {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding: 0 24px 36px; flex-wrap: wrap;
    }

    .source-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem; font-weight: 300;
      letter-spacing: 0.03em;
      padding: 5px 14px;
      border: 1px solid transparent;
      border-radius: 100px;
      background: transparent;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .source-btn:hover { color: var(--text-secondary); }
    .source-btn.active {
      color: var(--text-secondary);
      border-color: var(--border-soft);
      background: var(--warm-white);
    }

    /* ── Main ── */
    main {
      position: relative; z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── This Week hero section ── */
    .week-hero {
      margin-bottom: 40px;
    }

    .week-hero .week-label {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500; font-size: 1.5rem;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .week-hero .week-dates {
      font-size: 0.82rem;
      color: var(--text-light);
      font-weight: 300;
      letter-spacing: 0.03em;
      margin-bottom: 20px;
    }

    /* ── Date group ── */
    .date-group { margin-bottom: 32px; }

    .date-header {
      display: flex; align-items: baseline; gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }
    .date-header .day-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500; font-size: 1.3rem;
      color: var(--text-primary);
    }
    .date-header .day-name .today-dot {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--rose-deep);
      border-radius: 50%;
      margin-left: 6px;
      vertical-align: middle;
      transform: translateY(-1px);
    }
    .date-header .full-date {
      font-weight: 300; font-size: 0.8rem;
      color: var(--text-light);
      letter-spacing: 0.03em;
    }

    /* ── Event card ── */
    .event-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--warm-white);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 22px 24px;
      margin-bottom: 10px;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
    }

    .event-card:hover {
      box-shadow: var(--card-hover-shadow);
      transform: translateY(-2px);
      border-color: transparent;
    }

    .event-card .card-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .event-card .card-emoji {
      font-size: 1.6rem;
      flex-shrink: 0;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(214,234,240,0.3), rgba(242,212,215,0.3));
      border-radius: 12px;
    }

    .event-card .card-content { flex: 1; min-width: 0; }

    .event-card .card-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
      margin-bottom: 4px;
    }

    .event-card .event-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500; font-size: 1.2rem;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .event-card .event-subtitle {
      font-size: 0.78rem;
      color: var(--text-light);
      font-weight: 300; font-style: italic;
      margin-bottom: 6px;
    }

    .event-card .price-tag {
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.04em;
      padding: 3px 11px;
      border-radius: 100px;
      white-space: nowrap; flex-shrink: 0;
    }
    .price-tag.free { background: #E8F5E9; color: #4A7A4A; }
    .price-tag.paid { background: var(--ice-blue); color: #4A7A8A; }
    .price-tag.tba { background: #F5F0E8; color: #8A7A5A; }

    .event-card .event-meta {
      display: flex; align-items: center;
      gap: 14px; flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .event-card .meta-item {
      display: flex; align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 300;
    }
    .meta-item .icon { font-size: 0.75rem; opacity: 0.5; }

    .event-card .event-desc {
      font-size: 0.82rem;
      color: var(--text-light);
      font-weight: 300;
      line-height: 1.5;
    }

    .event-card .card-footer {
      display: flex; align-items: center;
      gap: 8px; margin-top: 10px;
    }

    .event-card .source-text {
      font-size: 0.65rem;
      color: var(--text-light);
      font-weight: 300;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .recurring-pill {
      font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.03em;
      padding: 2px 9px;
      border-radius: 100px;
      background: #FFF3E0; color: #A0783A;
    }

    .event-card .arrow-link {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--text-light);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .event-card:hover .arrow-link { opacity: 1; }

    /* ── Decorative dots between cards ── */
    .card-separator {
      text-align: center;
      font-size: 0.5rem;
      color: var(--border-soft);
      letter-spacing: 6px;
      margin: 2px 0;
    }

    /* ── Divider ── */
    .section-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin: 40px auto 24px; max-width: 200px;
    }
    .section-divider .line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
    }
    .section-divider .icon { font-size: 0.7rem; color: var(--text-light); opacity: 0.4; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 60px 24px;
    }
    .empty-state .flower-icon { font-size: 2.5rem; margin-bottom: 16px; opacity: 0.5; }
    .empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; color: var(--text-light); font-weight: 400;
    }

    /* ── "More" link ── */
    .more-link {
      text-align: center;
      padding: 16px;
      font-size: 0.78rem;
      color: var(--text-light);
      font-weight: 300;
    }
    .more-link span {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .more-link span:hover { color: var(--text-secondary); }

    /* ── Footer ── */
    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 24px;
      border-top: 1px solid var(--border-soft);
    }
    footer p {
      font-size: 0.72rem; color: var(--text-light);
      font-weight: 300; letter-spacing: 0.04em;
    }
    footer a {
      color: var(--text-secondary); text-decoration: none;
    }
    footer a:hover { color: var(--text-primary); }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .event-card {
      animation: fadeInUp 0.35s ease both;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 36px 16px 12px; }
      .event-card { padding: 16px 18px; border-radius: 12px; }
      .event-card .card-emoji { width: 36px; height: 36px; font-size: 1.3rem; border-radius: 10px; }
      .event-card .card-top { flex-direction: column; gap: 4px; }
      .event-card .event-meta { gap: 8px; }
      main { padding: 0 14px 60px; }
    }
  </style>
</head>
<body>

<div class="bg-orb"></div>

<header>
  <div class="bow-decoration">
    <svg viewBox="0 0 80 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M40 18C32 8 18 4 8 10C2 14 2 22 8 26C14 30 32 28 40 18Z" stroke="#E8B4BA" stroke-width="1.2" fill="none"/>
      <path d="M40 18C48 8 62 4 72 10C78 14 78 22 72 26C66 30 48 28 40 18Z" stroke="#E8B4BA" stroke-width="1.2" fill="none"/>
      <circle cx="40" cy="18" r="3" fill="#E8B4BA" opacity="0.5"/>
      <path d="M37 22C36 30 35 34 34 36" stroke="#E8B4BA" stroke-width="1" fill="none"/>
      <path d="M43 22C44 30 45 34 46 36" stroke="#E8B4BA" stroke-width="1" fill="none"/>
    </svg>
  </div>
  <h1>SF Creative Events <span class="flower">✿</span></h1>
  <p class="subtitle">workshops · exhibitions · craft fairs · art</p>
  <div class="ribbon-divider">
    <div class="line"></div>
    <span class="bow-icon">❋</span>
    <div class="line"></div>
  </div>
</header>

<div class="time-filter" id="timeFilter">
  <button class="time-btn active" data-time="week">This Week</button>
  <button class="time-btn" data-time="upcoming">Upcoming</button>
  <button class="time-btn" data-time="all">All</button>
</div>

<div class="source-filter" id="sourceFilter">
  <button class="source-btn active" data-source="all">all</button>
  <button class="source-btn" data-source="tiat">tiat</button>
  <button class="source-btn" data-source="nowplace">nowplace</button>
  <button class="source-btn" data-source="junk-journal">junk journal</button>
  <button class="source-btn" data-source="funcheap">funcheap</button>
</div>

<main id="eventsContainer">
  <div class="empty-state" id="loading">
    <div class="flower-icon">✿</div>
    <p>Loading events...</p>
  </div>
</main>

<footer>
  <p>curated with care ✿ <a href="https://github.com/amywork777/sf-creative-events" target="_blank">github</a></p>
</footer>

<script>
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let allEvents = [];
let activeSource = 'all';
let activeTime = 'week';

async function loadEvents() {
  try {
    const res = await fetch('/events.json');
    allEvents = await res.json();
    render();
  } catch (err) {
    document.getElementById('eventsContainer').innerHTML =
      '<div class="empty-state"><div class="flower-icon">✿</div><p>Could not load events</p></div>';
  }
}

function parseDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function formatDate(s) {
  const d = parseDate(s);
  return { dayName: DAYS[d.getDay()], fullDate: `${MONTHS[d.getMonth()]} ${d.getDate()}` };
}

function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }

function isToday(s) {
  const d = parseDate(s), t = today();
  return d.getTime() === t.getTime();
}

function isTomorrow(s) {
  const d = parseDate(s), t = today();
  t.setDate(t.getDate() + 1);
  return d.getTime() === t.getTime();
}

function isPast(s) { return parseDate(s) < today(); }

function getWeekRange() {
  const t = today();
  const dayOfWeek = t.getDay();
  // week = Mon-Sun
  const mon = new Date(t);
  mon.setDate(t.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return { start: mon, end: sun };
}

function isThisWeek(dateStr) {
  const { start, end } = getWeekRange();
  const d = parseDate(dateStr);
  return d >= start && d <= end;
}

function getPriceClass(p) {
  if (!p || p === 'TBA') return 'tba';
  if (p === 'Free' || p === '$0') return 'free';
  return 'paid';
}

function dayLabel(dateStr) {
  if (isToday(dateStr)) return 'Today';
  if (isTomorrow(dateStr)) return 'Tomorrow';
  return null;
}

function render() {
  const container = document.getElementById('eventsContainer');
  let events = allEvents;

  if (activeSource !== 'all') {
    events = events.filter(e => e.source === activeSource);
  }

  const { start, end } = getWeekRange();

  if (activeTime === 'week') {
    events = events.filter(e => {
      const d = parseDate(e.date);
      const ed = e.endDate ? parseDate(e.endDate) : d;
      return ed >= start && d <= end;
    });
  } else if (activeTime === 'upcoming') {
    events = events.filter(e => !isPast(e.endDate || e.date));
  }

  if (events.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="flower-icon">✿</div><p>No events found</p></div>';
    return;
  }

  // Group by date
  const groups = {};
  events.forEach(ev => {
    const key = ev.date;
    if (!groups[key]) groups[key] = [];
    groups[key].push(ev);
  });
  const sortedDates = Object.keys(groups).sort((a,b) => parseDate(a) - parseDate(b));

  let html = '';

  if (activeTime === 'week') {
    const weekLabel = `${MONTHS[start.getMonth()]} ${start.getDate()} – ${start.getMonth() !== end.getMonth() ? MONTHS[end.getMonth()] + ' ' : ''}${end.getDate()}`;
    html += `<div class="week-hero"><div class="week-label">This Week</div><div class="week-dates">${weekLabel}</div></div>`;
  }

  let cardIndex = 0;
  sortedDates.forEach((dateKey, gi) => {
    const { dayName, fullDate } = formatDate(dateKey);
    const special = dayLabel(dateKey);
    const pastDate = isPast(dateKey);
    const opacity = pastDate ? ' style="opacity:0.45"' : '';
    const todayDot = special === 'Today' ? '<span class="today-dot"></span>' : '';
    const label = special ? `${dayName} · ${special}` : dayName;

    html += `<div class="date-group"${opacity}>`;
    html += `<div class="date-header">`;
    html += `<span class="day-name">${label}${todayDot}</span>`;
    html += `<span class="full-date">${fullDate}</span>`;
    html += `</div>`;

    groups[dateKey].forEach((ev, i) => {
      const priceClass = getPriceClass(ev.price);
      const priceLabel = ev.price || 'TBA';
      const delay = Math.min(cardIndex * 0.04, 0.4);
      cardIndex++;

      html += `<a class="event-card" href="${ev.link}" target="_blank" rel="noopener" style="animation-delay:${delay}s">`;
      html += `<div class="card-row">`;
      html += `<div class="card-emoji">${ev.emoji || '✿'}</div>`;
      html += `<div class="card-content">`;
      html += `<div class="card-top">`;
      html += `<div class="event-title">${ev.title}</div>`;
      html += `<span class="price-tag ${priceClass}">${priceLabel}</span>`;
      html += `</div>`;
      if (ev.subtitle) html += `<div class="event-subtitle">${ev.subtitle}</div>`;
      html += `<div class="event-meta">`;
      html += `<span class="meta-item"><span class="icon">◷</span> ${ev.time}</span>`;
      html += `<span class="meta-item"><span class="icon">◇</span> ${ev.location}</span>`;
      html += `</div>`;
      html += `<div class="event-desc">${ev.description}</div>`;
      html += `<div class="card-footer">`;
      html += `<span class="source-text">${ev.sourceName}</span>`;
      if (ev.recurring) html += `<span class="recurring-pill">↻ ${ev.recurring}</span>`;
      html += `<span class="arrow-link">→</span>`;
      html += `</div>`;
      html += `</div>`;
      html += `</div>`;
      html += `</a>`;
    });

    html += `</div>`;

    if (gi < sortedDates.length - 1) {
      html += `<div class="section-divider"><div class="line"></div><div class="icon">✿</div><div class="line"></div></div>`;
    }
  });

  container.innerHTML = html;
}

// Time filter
document.getElementById('timeFilter').addEventListener('click', e => {
  const btn = e.target.closest('.time-btn');
  if (!btn) return;
  activeTime = btn.dataset.time;
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

// Source filter
document.getElementById('sourceFilter').addEventListener('click', e => {
  const btn = e.target.closest('.source-btn');
  if (!btn) return;
  activeSource = btn.dataset.source;
  document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

loadEvents();
</script>
</body>
</html>
