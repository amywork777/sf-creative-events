<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SF Creative Events ✿</title>
  <meta name="description" content="Curated creative events in San Francisco — workshops, exhibitions, craft fairs, and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ice-blue: #D6EAF0;
      --ice-blue-deep: #A8D4E0;
      --rose-pink: #F2D4D7;
      --rose-deep: #E8B4BA;
      --lavender: #E1D5ED;
      --lavender-deep: #C9B3DB;
      --cream: #FDF8F4;
      --warm-white: #FEFCFA;
      --text-primary: #3A3238;
      --text-secondary: #7A6B74;
      --text-light: #A89BA2;
      --border-soft: #EDE6E9;
      --card-shadow: 0 2px 16px rgba(58, 50, 56, 0.06);
      --card-hover-shadow: 0 8px 32px rgba(58, 50, 56, 0.1);

      --source-tiat: #D6EAF0;
      --source-tiat-text: #4A7A8A;
      --source-tiat-border: #A8D4E0;
      --source-nowplace: #E1D5ED;
      --source-nowplace-text: #6A5A7A;
      --source-nowplace-border: #C9B3DB;
      --source-junk-journal: #F2D4D7;
      --source-junk-journal-text: #8A5A62;
      --source-junk-journal-border: #E8B4BA;
      --source-funcheap: #DDE9D6;
      --source-funcheap-text: #5A7A4A;
      --source-funcheap-border: #B8D4A8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background decoration ── */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(214, 234, 240, 0.4) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(242, 212, 215, 0.35) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-orb {
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(225, 213, 237, 0.3) 0%, transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Bow ribbon decoration ── */
    .bow-decoration {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      width: 64px;
      height: 32px;
    }

    .bow-decoration svg {
      width: 64px;
      height: 32px;
      opacity: 0.5;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 24px 20px;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      color: var(--text-primary);
      letter-spacing: 0.02em;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    header h1 .flower {
      display: inline-block;
      font-size: 0.7em;
      opacity: 0.6;
      transform: translateY(-2px);
    }

    header .subtitle {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      color: var(--text-light);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* ── Ribbon divider ── */
    .ribbon-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 0 auto 40px;
      max-width: 320px;
    }

    .ribbon-divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
    }

    .ribbon-divider .bow-icon {
      font-size: 1rem;
      color: var(--text-light);
      opacity: 0.6;
    }

    /* ── Filter bar ── */
    .filter-bar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 24px 40px;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      padding: 8px 20px;
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      background: var(--warm-white);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .filter-btn:hover {
      border-color: var(--rose-deep);
      color: var(--text-primary);
      background: white;
    }

    .filter-btn.active {
      background: var(--text-primary);
      color: var(--cream);
      border-color: var(--text-primary);
    }

    .filter-btn[data-source="tiat"].active {
      background: var(--source-tiat-text);
      border-color: var(--source-tiat-text);
    }
    .filter-btn[data-source="nowplace"].active {
      background: var(--source-nowplace-text);
      border-color: var(--source-nowplace-text);
    }
    .filter-btn[data-source="junk-journal"].active {
      background: var(--source-junk-journal-text);
      border-color: var(--source-junk-journal-text);
    }
    .filter-btn[data-source="funcheap"].active {
      background: var(--source-funcheap-text);
      border-color: var(--source-funcheap-text);
    }

    /* ── Time toggle ── */
    .time-toggle {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 24px 32px;
    }

    .time-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      padding: 6px 16px;
      border: 1px solid var(--border-soft);
      border-radius: 100px;
      background: var(--warm-white);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .time-btn:hover {
      border-color: var(--ice-blue-deep);
      color: var(--text-primary);
    }

    .time-btn.active {
      background: var(--ice-blue);
      border-color: var(--ice-blue-deep);
      color: var(--source-tiat-text);
    }

    /* ── Main ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── Date group ── */
    .date-group {
      margin-bottom: 40px;
    }

    .date-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-soft);
    }

    .date-header .day-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 1.4rem;
      color: var(--text-primary);
    }

    .date-header .full-date {
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.82rem;
      color: var(--text-light);
      letter-spacing: 0.04em;
    }

    .date-header .event-count {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-light);
      letter-spacing: 0.03em;
      font-weight: 300;
    }

    /* ── Event card ── */
    .event-card {
      background: var(--warm-white);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 12px;
      transition: all 0.35s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .event-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      border-radius: 16px 0 0 16px;
      transition: opacity 0.3s ease;
    }

    .event-card[data-source="tiat"]::before { background: var(--source-tiat-border); }
    .event-card[data-source="nowplace"]::before { background: var(--source-nowplace-border); }
    .event-card[data-source="junk-journal"]::before { background: var(--source-junk-journal-border); }
    .event-card[data-source="funcheap"]::before { background: var(--source-funcheap-border); }

    .event-card:hover {
      box-shadow: var(--card-hover-shadow);
      transform: translateY(-2px);
      border-color: transparent;
    }

    .event-card .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .event-card .event-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 1.25rem;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .event-card .price-tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 4px 12px;
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .price-tag.free {
      background: #E8F5E9;
      color: #4A7A4A;
    }

    .price-tag.paid {
      background: var(--ice-blue);
      color: var(--source-tiat-text);
    }

    .price-tag.tba {
      background: #F5F0E8;
      color: #8A7A5A;
    }

    .event-card .event-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .event-card .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-weight: 300;
    }

    .meta-item .icon {
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .event-card .event-desc {
      font-size: 0.85rem;
      color: var(--text-light);
      font-weight: 300;
      line-height: 1.55;
    }

    .event-card .source-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 100px;
      margin-top: 12px;
    }

    .source-badge[data-source="tiat"] {
      background: var(--source-tiat);
      color: var(--source-tiat-text);
    }
    .source-badge[data-source="nowplace"] {
      background: var(--source-nowplace);
      color: var(--source-nowplace-text);
    }
    .source-badge[data-source="junk-journal"] {
      background: var(--source-junk-journal);
      color: var(--source-junk-journal-text);
    }
    .source-badge[data-source="funcheap"] {
      background: var(--source-funcheap);
      color: var(--source-funcheap-text);
    }

    .recurring-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      padding: 3px 10px;
      border-radius: 100px;
      background: #FFF3E0;
      color: #A0783A;
      margin-top: 12px;
      margin-left: 6px;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
    }

    .empty-state .flower-icon {
      font-size: 2.5rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      color: var(--text-light);
      font-weight: 400;
    }

    /* ── Past events notice ── */
    .past-notice {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-light);
      font-weight: 300;
      letter-spacing: 0.03em;
      padding: 16px;
      margin-bottom: 32px;
      border-top: 1px solid var(--border-soft);
    }

    .past-notice span {
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .past-notice span:hover {
      color: var(--text-secondary);
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border-soft);
    }

    footer p {
      font-size: 0.75rem;
      color: var(--text-light);
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text-primary);
    }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .event-card {
      animation: fadeInUp 0.4s ease both;
    }

    .date-group:nth-child(1) .event-card { animation-delay: 0.05s; }
    .date-group:nth-child(2) .event-card { animation-delay: 0.1s; }
    .date-group:nth-child(3) .event-card { animation-delay: 0.15s; }
    .date-group:nth-child(4) .event-card { animation-delay: 0.2s; }
    .date-group:nth-child(5) .event-card { animation-delay: 0.25s; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header {
        padding: 40px 20px 12px;
      }

      .event-card {
        padding: 18px 20px;
        border-radius: 12px;
      }

      .event-card .card-top {
        flex-direction: column;
        gap: 8px;
      }

      .event-card .event-meta {
        gap: 10px;
      }

      main {
        padding: 0 16px 60px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-orb"></div>

  <header>
    <div class="bow-decoration">
      <svg viewBox="0 0 80 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 18C32 8 18 4 8 10C2 14 2 22 8 26C14 30 32 28 40 18Z" stroke="#E8B4BA" stroke-width="1.2" fill="none"/>
        <path d="M40 18C48 8 62 4 72 10C78 14 78 22 72 26C66 30 48 28 40 18Z" stroke="#E8B4BA" stroke-width="1.2" fill="none"/>
        <circle cx="40" cy="18" r="3" fill="#E8B4BA" opacity="0.5"/>
        <path d="M37 22C36 30 35 34 34 36" stroke="#E8B4BA" stroke-width="1" fill="none"/>
        <path d="M43 22C44 30 45 34 46 36" stroke="#E8B4BA" stroke-width="1" fill="none"/>
      </svg>
    </div>
    <h1>SF Creative Events <span class="flower">✿</span></h1>
    <p class="subtitle">workshops · exhibitions · craft fairs · art</p>
    <div class="ribbon-divider">
      <div class="line"></div>
      <span class="bow-icon">❋</span>
      <div class="line"></div>
    </div>
  </header>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-source="all">All</button>
    <button class="filter-btn" data-source="tiat">TIAT</button>
    <button class="filter-btn" data-source="nowplace">nowplace 此间</button>
    <button class="filter-btn" data-source="junk-journal">Junk Journal</button>
    <button class="filter-btn" data-source="funcheap">Funcheap</button>
  </div>

  <div class="time-toggle" id="timeToggle">
    <button class="time-btn active" data-time="upcoming">Upcoming</button>
    <button class="time-btn" data-time="all">All Events</button>
  </div>

  <main id="eventsContainer">
    <div class="empty-state" id="loading">
      <div class="flower-icon">✿</div>
      <p>Loading events...</p>
    </div>
  </main>

  <footer>
    <p>curated with care ✿ <a href="https://github.com/amywork777/sf-creative-events" target="_blank">github</a></p>
  </footer>

  <script>
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    let allEvents = [];
    let activeSource = 'all';
    let showUpcoming = true;

    async function loadEvents() {
      try {
        const res = await fetch('/events.json');
        allEvents = await res.json();
        render();
      } catch (err) {
        document.getElementById('eventsContainer').innerHTML =
          '<div class="empty-state"><div class="flower-icon">✿</div><p>Could not load events</p></div>';
      }
    }

    function parseDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDate(dateStr) {
      const date = parseDate(dateStr);
      return {
        dayName: DAYS[date.getDay()],
        fullDate: `${MONTHS[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`,
        dateKey: dateStr
      };
    }

    function isToday(dateStr) {
      const today = new Date();
      const d = parseDate(dateStr);
      return d.getFullYear() === today.getFullYear() &&
             d.getMonth() === today.getMonth() &&
             d.getDate() === today.getDate();
    }

    function isPast(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const endDate = parseDate(dateStr);
      return endDate < today;
    }

    function getPriceClass(price) {
      if (!price || price === 'TBA') return 'tba';
      if (price === 'Free' || price === '$0') return 'free';
      return 'paid';
    }

    function render() {
      const container = document.getElementById('eventsContainer');

      let events = allEvents;

      // Filter by source
      if (activeSource !== 'all') {
        events = events.filter(e => e.source === activeSource);
      }

      // Split into upcoming and past
      const upcoming = events.filter(e => !isPast(e.endDate || e.date));
      const past = events.filter(e => isPast(e.endDate || e.date));

      const displayEvents = showUpcoming ? upcoming : events;

      if (displayEvents.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="flower-icon">✿</div><p>No events found</p></div>';
        return;
      }

      // Group by date
      const groups = {};
      displayEvents.forEach(event => {
        const key = event.date;
        if (!groups[key]) groups[key] = [];
        groups[key].push(event);
      });

      // Sort dates
      const sortedDates = Object.keys(groups).sort((a, b) => parseDate(a) - parseDate(b));

      let html = '';

      // If showing upcoming and there are past events, show a notice
      if (showUpcoming && past.length > 0) {
        // no notice needed at top
      }

      sortedDates.forEach(dateKey => {
        const { dayName, fullDate } = formatDate(dateKey);
        const dateEvents = groups[dateKey];
        const todayLabel = isToday(dateKey) ? ' · Today' : '';
        const pastClass = isPast(dateKey) ? ' style="opacity: 0.5"' : '';

        html += `<div class="date-group"${pastClass}>`;
        html += `<div class="date-header">`;
        html += `<span class="day-name">${dayName}${todayLabel}</span>`;
        html += `<span class="full-date">${fullDate}</span>`;
        html += `<span class="event-count">${dateEvents.length} event${dateEvents.length !== 1 ? 's' : ''}</span>`;
        html += `</div>`;

        dateEvents.forEach(event => {
          const priceClass = getPriceClass(event.price);
          const priceLabel = event.price || 'TBA';
          const endDateLabel = event.endDate ? ` – ${formatDate(event.endDate).fullDate}` : '';

          html += `<div class="event-card" data-source="${event.source}" onclick="window.open('${event.link}', '_blank')">`;
          html += `<div class="card-top">`;
          html += `<div class="event-title">${event.title}</div>`;
          html += `<span class="price-tag ${priceClass}">${priceLabel}</span>`;
          html += `</div>`;
          html += `<div class="event-meta">`;
          html += `<span class="meta-item"><span class="icon">◷</span> ${event.time}${endDateLabel}</span>`;
          html += `<span class="meta-item"><span class="icon">◇</span> ${event.location}</span>`;
          html += `</div>`;
          html += `<div class="event-desc">${event.description}</div>`;
          html += `<span class="source-badge" data-source="${event.source}">${event.sourceName}</span>`;
          if (event.recurring) {
            html += `<span class="recurring-badge">↻ ${event.recurring}</span>`;
          }
          html += `</div>`;
        });

        html += `</div>`;
      });

      if (showUpcoming && past.length > 0) {
        html += `<div class="past-notice">${past.length} past event${past.length !== 1 ? 's' : ''} hidden · <span onclick="setTimeFilter('all')">show all</span></div>`;
      }

      container.innerHTML = html;
    }

    function setTimeFilter(val) {
      showUpcoming = val === 'upcoming';
      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.time === val);
      });
      render();
    }

    // Filter buttons
    document.getElementById('filterBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      activeSource = btn.dataset.source;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });

    // Time toggle
    document.getElementById('timeToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('.time-btn');
      if (!btn) return;
      setTimeFilter(btn.dataset.time);
    });

    loadEvents();
  </script>
</body>
</html>
